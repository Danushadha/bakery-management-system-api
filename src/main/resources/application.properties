    spring.application.name=bakery-management-system-api


    server.port=${PORT:8082}

    #database configuration
    spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bakery_management_system?createDatabaseIfNotExist=true}
    spring.datasource.username=${DB_USERNAME:root}
    spring.datasource.password=${DB_PASSWORD:root}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.keepalive-time=10000
spring.datasource.hikari.connection-timeout=30000

    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


    spring.jpa.generate-ddl =true
    spring.jpa.hibernate.ddl-auto=update

    spring.jackson.time-zone=Asia/Colombo

    # JWT
    jwt.secret=${JWT_SECRET}